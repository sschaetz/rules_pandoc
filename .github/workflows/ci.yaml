name: CI

on:
  push:
    branches:
      - develop
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  buildifier:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: check BUILD/.bzl formatting and lint
        run: |
          bazel test //:buildifier.check

  ci-examples:
    runs-on: ${{ matrix.os }}
    env:
      # On Windows, `shell: bash` is Git Bash (MSYS2), which rewrites the
      # leading // of Bazel labels / Excluding all args from path conversion
      # to keep labels intact for every bash step.
      MSYS2_ARG_CONV_EXCL: "*"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm, windows-2022]
        bazel-version: [7.7.1, 8.2.0, 9.1.1]

    steps:
      # Checkout the code
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: set bazel version
        run: echo "${{ matrix.bazel-version }}" > .bazelversion
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true
      - name: build examples
        working-directory: "${{ github.workspace }}/examples"
        run: |
          bazel build //...
      # ex005 is tagged "manual" (skipped by //...). Build it by name with
      # stamping enabled to exercise the git-sha example on every OS. The status
      # command is invoked via `bash` so it runs on Windows (Git Bash) too.
      - name: build stamped example
        working-directory: "${{ github.workspace }}/examples"
        shell: bash
        run: |
          bazel build //ex005:ex005_html --stamp \
            --workspace_status_command="bash tools/workspace_status.sh"
      - name: collect artifacts
        working-directory: "${{ github.workspace }}/examples"
        shell: bash
        run: |
          # Copy each target's output into a flat dir for upload.
          mkdir -p "${{ github.workspace }}/artifacts"
          for f in $(bazel cquery //... --output=files 2>/dev/null); do
            cp "$f" "${{ github.workspace }}/artifacts/" || true
          done
          ls -la "${{ github.workspace }}/artifacts"
      - name: upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: examples-${{ github.sha }}-${{ matrix.os }}-bazel-${{ matrix.bazel-version }}
          path: artifacts/
          if-no-files-found: error
