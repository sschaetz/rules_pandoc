name: CI

on:
  push:
    branches:
      - develop
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  ci-examples:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # TODO: add windows-2022
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm]
        bazel-version: [7.7.1, 8.2.0, 9.1.1]

    steps:
      # Checkout the code
      - uses: actions/checkout@v4
      - name: set bazel version
        run: echo "${{ matrix.bazel-version }}" > .bazelversion
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Avoid downloading Bazel every time.
          bazelisk-cache: true
          # Store build cache per workflow.
          disk-cache: ${{ github.workflow }}
          # Share repository cache between workflows.
          repository-cache: true
      - name: build examples
        working-directory: "${{ github.workspace }}/examples"
        run: |
          bazel build //...
